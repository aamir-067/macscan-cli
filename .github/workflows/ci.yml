name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests on macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install test tools
        run: brew install shellcheck bats-core yara

      - name: Static checks
        run: make lint

      - name: Unit tests
        run: make test-unit

      - name: Module smoke tests
        run: make test-smoke

      - name: Detection tests
        run: make test-detection

      - name: Build tests
        run: make test-build

      - name: Build
        run: make build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
