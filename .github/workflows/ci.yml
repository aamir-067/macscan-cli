name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests on macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install test tools
        run: brew install shellcheck bats-core yara

      - name: Static checks
        run: make lint

      - name: Unit tests
        run: make test-unit

      - name: Module smoke tests
        run: make test-smoke

      - name: Detection tests
        run: make test-detection

      - name: Build tests
        run: make test-build

      # Job logs need a signed-in account; annotations are public. Re-run the suites and put
      # each failing test with its output in one annotation, so a failure can be read anywhere.
      - name: Failing tests as annotations
        if: failure()
        run: |
          for t in lint test-unit test-smoke test-detection test-build; do
            make "$t" > "$RUNNER_TEMP/$t.log" 2>&1 && continue
            msg=$( (grep -A12 '^not ok' "$RUNNER_TEMP/$t.log" || tail -25 "$RUNNER_TEMP/$t.log") | head -60)
            msg=${msg//'%'/'%25'}; msg=${msg//$'\r'/}; msg=${msg//$'\n'/'%0A'}
            echo "::error title=make $t failed::$msg"
          done

      - name: Build
        run: make build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
