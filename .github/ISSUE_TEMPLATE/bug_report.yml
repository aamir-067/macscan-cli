name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste scan reports.** They contain personal data about your Mac. Quote only the one or two lines needed, and remove names and paths you do not want public.
        Security vulnerabilities go through private reporting (Security > Report a vulnerability), not issues.
  - type: input
    id: version
    attributes:
      label: macscan version
      description: Output of `macscan --version`
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 27.0, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. macscan --only 05\n2. ..."
  - type: textarea
    id: log
    attributes:
      label: Relevant output (redacted)
      render: text
